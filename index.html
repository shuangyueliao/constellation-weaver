function tone(f, dur, type, g, when, slide) {
  if (!AC) return;
  try {
    var t0 = AC.currentTime + (when || 0);
    var o = AC.createOscillator(), gn = AC.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
    gn.gain.setValueAtTime(0.0001, t0);
    gn.gain.exponentialRampToValueAtTime(g || 0.1, t0 + 0.015);
    gn.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(gn); gn.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}

// ---------- 程序化背景（星云噪点，一次性预渲染） ----------
var bgC = null, DUST = [];
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function buildBG() {
  bgC = document.createElement("canvas");
  bgC.width = W * dpr; bgC.height = H * dpr;
  var b = bgC.getContext("2d"); b.scale(dpr, dpr);
  var rnd = mulberry32(20260206);
  var g0 = b.createLinearGradient(0, 0, 0, H);
  g0.addColorStop(0, "#04050e"); g0.addColorStop(0.5, "#0a0c20"); g0.addColorStop(1, "#05060f");
  b.fillStyle = g0; b.fillRect(0, 0, W, H);
  var hues = [[96, 70, 200], [60, 110, 190], [150, 60, 170], [40, 90, 160], [120, 80, 220]];
  for (var i = 0; i < 7; i++) {
    var x = rnd() * W, y = rnd() * H, r = 90 + rnd() * 180, c = hues[i % 5];
    var gr = b.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, "rgba(" + c[0] + "," + c[1] + "," + c[2] + "," + (0.05 + rnd() * 0.07).toFixed(3) + ")");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    b.fillStyle = gr; b.fillRect(x - r, y - r, r * 2, r * 2);
  }
  for (var j = 0; j < 240; j++) {
    var a = 0.04 + rnd() * rnd() * 0.30;
    b.fillStyle = "rgba(220,230,255," + a.toFixed(3) + ")";
    var s = rnd() < 0.85 ? 1 : 2;
    b.fillRect(rnd() * W, rnd() * H, s, s);
  }
  DUST = [];
  for (var k = 0; k < 36; k++) DUST.push({ x: rnd() * W, y: rnd() * H, ph: rnd() * 6.28, sp: 0.4 + rnd() * 1.2 });
}

  var cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + "px"; canvas.style.height = ch + "px";
  hud.style.width = cw + "px"; bar.style.width = cw + "px";
}

// ---------- 关卡流程 ----------

// ---------- 粒子 ----------

// ---------- 渲染 ----------
var STARCOLS = ["#dfe8ff", "#ffe7c2", "#cfd6ff", "#ffd9b0", "#e8f0ff", "#ffc9d8"];

  ctx.fillStyle = "#dfe9ff"; ctx.beginPath(); ctx.arc(mx, my, 14, 0, 7); ctx.fill();

function drawTrails(dt) {
  var res = G.res; if (!res) return;
  for (var i = 0; i < res.pos.length; i++) {
    var p = res.pos[i], x = CX + R * p.u, y = CY - R * p.v;
    var tr = G.trail[i] || (G.trail[i] = []);
    var lp = G.lastPx[i];
    if (!lp || Math.abs(lp[0] - x) + Math.abs(lp[1] - y) > 1.2) {
      tr.push({ x: x, y: y, a: 0.5 });

    }

// ---------- 主循环 ----------
var last = 0;
function frame(ts) {
  var t = ts / 1000;
  var dt = Math.min(t - last, 0.05);
  if (!(dt > 0)) dt = 0.016;
  last = t;
  if (G.scene === "PLAY") {
    var L = LEVELS[G.lvl];
    G.elapsed += dt;
    if (L.drift) {                            // 时间挑战：天球自动漂移
      G.rot += L.drift * dt * (G.lvl % 2 ? -1 : 1);
      G.rot = ((G.rot % 360) + 360) % 360;
    }
    G.res = checkLevel(L, G.rot, G.tilt);
    var litN = 0, k, anyPol = false;
    for (k = 0; k < G.res.lit.length; k++) if (G.res.lit[k]) litN++;
    for (k = 0; k < G.res.polluted.length; k++) if (G.res.polluted[k]) anyPol = true;
    if (litN > G.prevLitN) {                  // 新连线 → 竖琴音阶
      harp(litN - 1);
      for (k = 0; k < L.pairs.length; k++) if (G.res.lit[k] && !G.prevLit[k]) burstAtPair(L, G.res, k, false);
    } else if (litN < G.prevLitN) {

    }
    G.prevLitN = litN; G.prevLit = G.res.lit.slice();
    if (anyPol && !G.prevPol && t - G.lastPolSnd > 0.4) { tone(130, 0.22, "sawtooth", 0.07); G.lastPolSnd = t; }
    G.prevPol = anyPol;
    if (G.res.win && !G.ready) readyChime();
    G.ready = G.res.win;
    weaveBtn.classList.toggle("pulse", G.ready);
    updHUD();
    // 旋转呼呼声音量
    if (whooshG) {
      var target = drag.on ? Math.min(0.12, Math.abs(drag.vel) * 0.004) : (L.drift ? 0.006 : 0);
      whooshG.gain.value += (target - whooshG.gain.value) * Math.min(1, dt * 10);
      whooshF.frequency.value = 420 + Math.min(500, Math.abs(drag.vel));
    }
  } else if (G.scene === "MENU") {
    G.rot = (G.rot + dt * 4) % 360;
  }
  render(t, dt);
  requestAnimationFrame(frame);
}

// ---------- 输入（拖拽旋转：鼠标 + 触控） ----------

  if (G.scene !== "PLAY") return;

}

  if (!drag.on || G.scene !== "PLAY") return;
  var rect = canvas.getBoundingClientRect();
  var dxL = (x - drag.x) * (W / rect.width);
  drag.x = x; drag.total += Math.abs(dxL);
  G.rot += dxL * SENS;
  G.rot = ((G.rot % 360) + 360) % 360;
  drag.vel = dxL * SENS * 60;
}
function dragEnd() {
  if (!drag.on) return;
  drag.on = false;
  if (drag.total > 5) { G.moves++; updHUD(); }   // 拖拽一次算 1 个旋转操作
  drag.vel = 0;
}
canvas.addEventListener("mousedown", function (e) { audioInit(); dragStart(e.clientX); });
window.addEventListener("mousemove", function (e) { dragMove(e.clientX); });
window.addEventListener("mouseup", dragEnd);
canvas.addEventListener("touchstart", function (e) { e.preventDefault(); audioInit(); dragStart(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener("touchmove", function (e) { e.preventDefault(); if (e.touches.length) dragMove(e.touches[0].clientX); }, { passive: false });
canvas.addEventListener("touchend", function (e) { e.preventDefault(); dragEnd(); }, { passive: false });
canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
function toggleTilt() {
  if (G.scene !== "PLAY") return;
  G.tilt = 1 - G.tilt;
  tiltBtn.textContent = "TILT " + (G.tilt ? "II" : "I");
  uiBlip();
}
tiltBtn.addEventListener("click", function () { audioInit(); toggleTilt(); });
weaveBtn.addEventListener("click", function () { audioInit(); doWeave(); });
menuBtn.addEventListener("click", function () { audioInit(); uiBlip(); if (G.scene === "PLAY" || G.scene === "WOVEN") cgPlayStop(false); showMenu(); });
sndBtn.addEventListener("click", function () {
  audioInit();
  prog.sound = prog.sound ? 0 : 1;
  if (master) master.gain.value = prog.sound;
  sndBtn.innerHTML = "&#9834; " + (prog.sound ? "ON" : "OFF");
  saveProg();
  if (prog.sound) uiBlip();
});
document.addEventListener("keydown", function (e) {
  audioInit();
  if (G.scene !== "PLAY") return;
  if (e.key === "ArrowLeft") { G.rot = (G.rot - 4 + 360) % 360; G.moves++; updHUD(); e.preventDefault(); }
  else if (e.key === "ArrowRight") { G.rot = (G.rot + 4) % 360; G.moves++; updHUD(); e.preventDefault(); }
  else if (e.key === "t" || e.key === "T") toggleTilt();
  else if (e.key === "Enter" || e.key === " " || e.key === "w" || e.key === "W") { e.preventDefault(); doWeave(); }
  else if (e.key === "Escape") { cgPlayStop(false); showMenu(); }
});
window.addEventListener("pointerdown", audioInit);

// ---------- 启动 ----------
buildBG();
loadProg();
if (master) master.gain.value = prog.sound;
sndBtn.innerHTML = "&#9834; " + (prog.sound ? "ON" : "OFF");
fit();
showMenu();
requestAnimationFrame(frame);
// 调试/测试钩子（不影响游戏逻辑）
window.__cw = { G: G, checkLevel: checkLevel, LEVELS: LEVELS, TILTS: TILTS, THRESH: THRESH };
</script>
